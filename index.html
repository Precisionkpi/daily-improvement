<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2E5D3B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="One Daily Improvement">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>One Daily Improvement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261116aa">
</head>
<body>
  <div class="welcome-screen" id="welcome-screen" hidden>
    <div class="welcome-content">
      <div class="welcome-brand">
        <div class="brand-mark">1</div>
        <h1>One Daily Improvement</h1>
      </div>
      <div class="welcome-company">Precision Lawn & Landscape</div>
      <h2 class="welcome-prompt">Who's logging in?</h2>
      <p class="welcome-sub">Pick your name to get started.</p>
      <div class="welcome-names" id="welcome-names"></div>
      <div class="welcome-lang">
        <button type="button" class="welcome-lang-btn" data-lang="en" id="welcome-lang-en">English</button>
        <button type="button" class="welcome-lang-btn" data-lang="es" id="welcome-lang-es">Español</button>
      </div>
      <div class="welcome-footer">One improvement a day — the climb never ends.</div>
    </div>
  </div>

  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark">1</div>
        <h1>One Daily Improvement</h1>
        <div class="brand-actions">
          <div class="lang-toggle" role="radiogroup" aria-label="Language">
            <button type="button" class="lang-opt" id="lang-opt-en" data-lang="en" role="radio" aria-checked="true">English</button>
            <button type="button" class="lang-opt" id="lang-opt-es" data-lang="es" role="radio" aria-checked="false">Español</button>
          </div>
        </div>
      </div>
      <p class="subtitle">Each day: one thing that made it difficult, or one move that pushes us forward.</p>
      <div class="stats" id="stats">
        <button class="stat" type="button" data-statfilter="week"><span class="stat-num" id="stat-week">—</span><span class="stat-label">This week</span></button>
        <button class="stat" type="button" data-statfilter="progress"><span class="stat-num" id="stat-progress">—</span><span class="stat-label">In progress</span></button>
        <button class="stat" type="button" data-statfilter="improved"><span class="stat-num" id="stat-improved">—</span><span class="stat-label">Improved</span></button>
      </div>
    </header>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" aria-selected="true" data-tab="submit" id="tab-submit">Submit</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="mine" id="tab-mine">Mine</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="inbox" id="tab-inbox">Inbox<span class="tab-badge" id="inbox-badge" hidden></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="everyone" id="tab-everyone">Feed</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="assignments" id="tab-assignments">Scoreboard</button>
    </div>

    <section id="panel-submit" role="tabpanel" aria-labelledby="tab-submit"></section>
    <section id="panel-mine" role="tabpanel" aria-labelledby="tab-mine" hidden></section>
    <section id="panel-inbox" role="tabpanel" aria-labelledby="tab-inbox" hidden></section>
    <section id="panel-everyone" role="tabpanel" aria-labelledby="tab-everyone" hidden></section>
    <section id="panel-assignments" role="tabpanel" aria-labelledby="tab-assignments" hidden></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=20261116aa"></script>
  <script src="app.js?v=20261116aa"></script>
</body>
</html>
